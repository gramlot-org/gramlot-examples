name: Publish release

# Run by hand on the version tag (Actions → Publish release → Run workflow → tag vX.Y.Z).
# PyPI (gramlot-examples) and npm (@gramlot/gramlot-examples) use trusted publishing from
# gramlot-org/gramlot-examples, publish.yml, with the environment release.
# The npm job skips a version that is already on npm.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require the version tag on main, matching versions and release notes
        env:
          RELEASE_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PYTHON'
          import json, os, tomllib
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert os.environ['RELEASE_REF'] == f'refs/tags/v{version}', 'Run the workflow on the exact version tag'
          assert json.load(open('package.json'))['version'] == version, 'package.json version differs'
          assert Path(f'.github/release-notes/v{version}.md').is_file(), 'Missing release notes'
          request = Request(f'https://api.github.com/repos/{os.environ["GH_REPO"]}/releases/tags/v{version}',
                            headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}'})
          try:
              with urlopen(request, timeout=30):
                  raise SystemExit('The GitHub release already exists')
          except HTTPError as error:
              if error.code != 404:
                  raise
          PYTHON

  verify:
    needs: validate
    uses: ./.github/workflows/tests.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the gallery bundle
        run: |
          npm install --ignore-scripts --package-lock=false
          npm run build
      - name: Build the Python distributions and the npm package
        run: |
          python -m pip install build
          python -m build --outdir dist
          npm pack --ignore-scripts --pack-destination dist
      - name: Check that the packaged gallery bundle is the fresh build and the wheel is complete
        run: |
          set -euo pipefail
          bundle=src/gramlot_examples/gallery/dist/gallery.js
          fresh=$(sha256sum "$bundle" | cut -d' ' -f1)
          wheel=$(unzip -p dist/*.whl gramlot_examples/gallery/dist/gallery.js | sha256sum | cut -d' ' -f1)
          npm=$(tar -xzOf dist/*.tgz "package/$bundle" | sha256sum | cut -d' ' -f1)
          test "$fresh" = "$wheel"
          test "$fresh" = "$npm"
          unzip -l dist/*.whl gramlot_examples/py.typed gramlot_examples/catalog.json
          echo "gallery bundle sha256 $fresh"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Create the GitHub release with the artifacts and their hashes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "Gramlot examples ${RELEASE_TAG#v}" \
            --notes-file ".github/release-notes/${RELEASE_TAG}.md"

  pypi:
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/gramlot-examples
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Keep only the Python distributions
        run: find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm:
    needs: github-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: npm 11.5.1 or later for trusted publishing
        run: npm install -g npm@latest
      - name: Publish the packed @gramlot/gramlot-examples
        run: |
          set -euo pipefail
          tarball=$(ls dist/*.tgz)
          version=$(tar -xzOf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          if npm view "@gramlot/gramlot-examples@$version" version >/dev/null 2>&1; then
            echo "@gramlot/gramlot-examples@$version is already on npm"
          else
            npm publish "$tarball" --access public
          fi
