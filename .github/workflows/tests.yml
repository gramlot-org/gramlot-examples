name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Build the gallery bundle
        run: npm run build
      - name: Test pages, gallery and buildGallery with Node
        if: matrix.runtime == 'node'
        run: npm test
      - name: Test pages, gallery and buildGallery with Bun
        if: matrix.runtime == 'bun'
        run: bun test ./tests
      - name: Install hello-world dependencies
        run: npm --prefix apps/hello-world install --ignore-scripts --package-lock=false
      - name: Test hello-world with Node
        if: matrix.runtime == 'node'
        run: npm --prefix apps/hello-world test
      - name: Test hello-world with Bun
        if: matrix.runtime == 'bun'
        working-directory: apps/hello-world
        run: bun test js/tests

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the gallery bundle
        run: |
          npm install --ignore-scripts --package-lock=false
          npm run build
      - name: Install the package
        run: python -m pip install .
      - name: Test pages and build_gallery
        run: python -m unittest discover -s tests

  browser:
    name: Browser check of e10 and e13 (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies, the published JavaScript host and Playwright Chromium
        run: |
          npm install --ignore-scripts --package-lock=false --no-save @gramlot/gramlot-js-server playwright
          npx playwright install --with-deps chromium
      - name: Install the package and the published Python host
        run: python -m pip install . 'gramlot-py-server[uvicorn]'
      - name: Show the core and host versions
        run: |
          npm ls @gramlot/gramlot @gramlot/gramlot-js-server
          python -m pip show gramlot gramlot-py-server | grep -E '^(Name|Version):'
      - name: Open e10 and e13 through the Python and JavaScript hosts
        run: |
          pages=src/gramlot_examples/pages/html_svg
          python scripts/serve_pages.py "$pages" 8091 > "$RUNNER_TEMP/python-host.log" 2>&1 &
          node scripts/serve_pages.mjs "$pages" 8092 > "$RUNNER_TEMP/javascript-host.log" 2>&1 &
          for port in 8091 8092; do
            for attempt in $(seq 1 60); do curl -fs -o /dev/null "http://127.0.0.1:$port/13_live_source" && break; sleep 1; done
          done
          node scripts/verify_e10_e13_browser.mjs http://127.0.0.1:8091 http://127.0.0.1:8092
      - name: Host logs
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/python-host.log" "$RUNNER_TEMP/javascript-host.log"

  core-main:
    name: Against gramlot main (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check out the gramlot core
        uses: actions/checkout@v4
        with:
          repository: gramlot-org/gramlot
          ref: main
          path: core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the core
        run: |
          npm --prefix core/js install --ignore-scripts --package-lock=false
          npm --prefix core/js run build
      - name: Install dependencies with the core from main
        run: npm install --ignore-scripts --package-lock=false --no-save --install-links ./core/js
      - name: Build the gallery bundle
        run: npm run build
      - name: Test JavaScript
        run: npm test
      - name: Install the package with the core from main
        run: |
          python -m pip install ./core
          python -m pip install --no-deps .
      - name: Test Python
        run: python -m unittest discover -s tests
