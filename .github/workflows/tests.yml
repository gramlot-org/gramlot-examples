name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Build the gallery bundle
        run: npm run build
      - name: Test pages, gallery and buildGallery with Node
        if: matrix.runtime == 'node'
        run: npm test
      - name: Test pages, gallery and buildGallery with Bun
        if: matrix.runtime == 'bun'
        run: bun test ./tests

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the gallery bundle
        run: |
          npm install --ignore-scripts --package-lock=false
          npm run build
      - name: Install the package
        run: python -m pip install .
      - name: Test pages and build_gallery
        run: python -m unittest discover -s tests

  browser:
    name: Browser check of every page (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies and Playwright Chromium
        run: |
          npm install --ignore-scripts --package-lock=false --no-save playwright
          npx playwright install --with-deps chromium
      - name: Install the package
        run: python -m pip install .
      - name: Show the core versions
        run: |
          npm ls @gramlot/gramlot
          python -m pip show gramlot | grep -E '^(Name|Version):'
      - name: Open every page through the core GramlotFileServer of Python and JavaScript
        run: |
          pages=src/gramlot_examples/pages
          python scripts/serve_pages.py "$pages" 8091 > "$RUNNER_TEMP/python-server.log" 2>&1 &
          node scripts/serve_pages.mjs "$pages" 8092 > "$RUNNER_TEMP/javascript-server.log" 2>&1 &
          for port in 8091 8092; do
            for attempt in $(seq 1 60); do curl -fs -o /dev/null "http://127.0.0.1:$port/html_svg/01_hello_world" && break; sleep 1; done
          done
          node scripts/verify_pages_browser.mjs http://127.0.0.1:8091 http://127.0.0.1:8092
          node scripts/verify_e10_e13_browser.mjs http://127.0.0.1:8091/html_svg http://127.0.0.1:8092/html_svg
      - name: Server logs
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/python-server.log" "$RUNNER_TEMP/javascript-server.log"

  core-main:
    name: Against gramlot main (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check out the gramlot core
        uses: actions/checkout@v4
        with:
          repository: gramlot-org/gramlot
          ref: main
          path: core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the core
        run: |
          npm --prefix core/js install --ignore-scripts --package-lock=false
          npm --prefix core/js run build
      - name: Install dependencies with the core from main
        run: npm install --ignore-scripts --package-lock=false --no-save --install-links ./core/js
      - name: Build the gallery bundle
        run: npm run build
      - name: Test JavaScript
        run: npm test
      - name: Install the package with the core from main
        run: |
          python -m pip install ./core
          python -m pip install --no-deps .
      - name: Test Python
        run: python -m unittest discover -s tests
