name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  GRAMLOT_SOURCE_REF: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'main' || 'develop' }}

permissions:
  contents: read

jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python deploy/galleries/test_update.py

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/prepare_docs_dependencies.py
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/prepare_docs.py
      - run: python -m sphinx -W --keep-going -b html build/docs-source build/docs-site
      - run: python scripts/check_docs.py

  javascript:
    name: JavaScript (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: python scripts/prepare_docs_dependencies.py
      - name: Build the gallery bundle
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python twin for Source parity checks
        run: |
          python -m pip install ./build/docs-dependencies/gramlot
          python -m pip install '.[test,chat]'
      - name: Test pages, gallery and buildGallery with Node
        if: matrix.runtime == 'node'
        run: npm test
      - name: Test pages, gallery and buildGallery with Bun
        if: matrix.runtime == 'bun'
        run: bun test ./tests

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the gallery bundle
        run: |
          python scripts/prepare_docs_dependencies.py
      - name: Build component browser modules
        run: npm run build
      - name: Install the package
        run: |
          python -m pip install ./build/docs-dependencies/gramlot
          python -m pip install '.[test,chat]'
      - name: Test pages and build_gallery
        run: python -m pytest -q tests

  browser:
    name: Browser check of every page (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies and Playwright Chromium
        run: |
          python scripts/prepare_docs_dependencies.py
          npx playwright install --with-deps chromium
      - name: Build component browser modules
        run: npm run build
      - name: Install the package
        run: |
          python -m pip install ./build/docs-dependencies/gramlot
          python -m pip install '.[test,chat]'
      - name: Show the core versions
        run: |
          npm ls @gramlot/gramlot
          python -m pip show gramlot | grep -E '^(Name|Version):'
      - name: Open every page through the core GramlotFileServer of Python and JavaScript
        run: |
          pages=src/gramlot_examples/pages
          python scripts/serve_pages.py "$pages" 8091 > "$RUNNER_TEMP/python-server.log" 2>&1 &
          node scripts/serve_pages.mjs "$pages" 8092 > "$RUNNER_TEMP/javascript-server.log" 2>&1 &
          for port in 8091 8092; do
            for attempt in $(seq 1 60); do curl -fs -o /dev/null "http://127.0.0.1:$port/00-html_svg/01-html_basics/01-hello_world" && break; sleep 1; done
          done
          node scripts/verify_pages_browser.mjs http://127.0.0.1:8091 http://127.0.0.1:8092
          node scripts/verify_e10_e13_browser.mjs http://127.0.0.1:8091/00-html_svg http://127.0.0.1:8092/00-html_svg
      - name: Server logs
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/python-server.log" "$RUNNER_TEMP/javascript-server.log"

  core-main:
    name: Against gramlot main (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare public source dependencies
        run: python scripts/prepare_docs_dependencies.py
      - name: Install the package with the source core
        run: |
          python -m pip install ./build/docs-dependencies/gramlot
          python -m pip install '.[test,chat]'
      - name: Test JavaScript including Python Source parity
        run: npm test
      - name: Test Python
        run: python -m pytest -q tests
