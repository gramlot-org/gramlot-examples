name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Build the gallery bundle
        run: npm run build
      - name: Test pages, gallery and buildGallery with Node
        if: matrix.runtime == 'node'
        run: npm test
      - name: Test pages, gallery and buildGallery with Bun
        if: matrix.runtime == 'bun'
        run: bun test ./tests
      - name: Install hello-world dependencies
        run: npm --prefix apps/hello-world install --ignore-scripts --package-lock=false
      - name: Test hello-world with Node
        if: matrix.runtime == 'node'
        run: npm --prefix apps/hello-world test
      - name: Test hello-world with Bun
        if: matrix.runtime == 'bun'
        working-directory: apps/hello-world
        run: bun test js/tests

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the gallery bundle
        run: |
          npm install --ignore-scripts --package-lock=false
          npm run build
      - name: Install the package
        run: python -m pip install .
      - name: Test pages and build_gallery
        run: python -m unittest discover -s tests

  core-main:
    name: Against gramlot main (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check out the gramlot core
        uses: actions/checkout@v4
        with:
          repository: gramlot-org/gramlot
          ref: main
          path: core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the core
        run: |
          npm --prefix core/js install --ignore-scripts --package-lock=false
          npm --prefix core/js run build
      - name: Install dependencies with the core from main
        run: npm install --ignore-scripts --package-lock=false --no-save --install-links ./core/js
      - name: Build the gallery bundle
        run: npm run build
      - name: Test JavaScript
        run: npm test
      - name: Install the package with the core from main
        run: |
          python -m pip install ./core
          python -m pip install --no-deps .
      - name: Test Python
        run: python -m unittest discover -s tests
