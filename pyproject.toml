[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gramlot-examples"
version = "0.2.7"
description = "Gramlot example pages, the gallery page and its catalogue."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["gramlot>=0.2.10"]

[project.urls]
Homepage = "https://github.com/gramlot-org/gramlot-examples"
Repository = "https://github.com/gramlot-org/gramlot-examples"
Issues = "https://github.com/gramlot-org/gramlot-examples/issues"

[tool.hatch.build]
# The gallery bundle is built by `npm run build` and is not tracked.
artifacts = ["src/gramlot_examples/gallery/dist/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/gramlot_examples"]
# The wheel carries the Python pages and the page modules NN_name.js, whose Logic the
# Python pages take; the gallery JavaScript sources stay in npm.
exclude = [
    "src/gramlot_examples/index.js",
    "src/gramlot_examples/gallery/browser",
    "src/gramlot_examples/gallery/page.js",
    "src/gramlot_examples/gallery/gallery-page.js",
]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/README.md", "/LICENSE", "/NOTICE", "/package.json", "/pyproject.toml"]
