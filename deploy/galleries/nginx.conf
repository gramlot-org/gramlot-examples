server {
    listen 80;
    server_name gallery-py.gramlot.dev gallery-js.gramlot.dev;
    location /.well-known/acme-challenge/ { root /var/www/gramlot-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name gallery-py.gramlot.dev;
    ssl_certificate /etc/letsencrypt/live/gramlot-galleries/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gramlot-galleries/privkey.pem;
    client_max_body_size 1m;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    # Public package assets are immutable within a deployed gallery generation.
    # Revalidate on every use; changing generation invalidates every browser copy.
    set $gallery_asset_etag 'W/"__GRAMLOT_GENERATION__:$uri"';
    location = /downloads/gramlot-gallery-serverless.zip {
        alias /opt/gramlot-galleries/downloads/gramlot-gallery-serverless.zip;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="gramlot-gallery-serverless.zip"';
        add_header Cache-Control 'no-cache';
    }
    location ~ ^/(assets|gallery|themes)/[A-Za-z0-9_@./-]+\.(js|css|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|ico)$ {
        add_header Cache-Control "private, no-cache, must-revalidate";
        add_header ETag $gallery_asset_etag;
        if ($http_if_none_match = $gallery_asset_etag) { return 304; }
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_pass http://127.0.0.1:19182;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location = /gramlot/store {
        proxy_pass http://127.0.0.1:19182;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:19182;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}

