server {
    listen 80;
    server_name gallery-py.gramlot.dev gallery-js.gramlot.dev;
    location /.well-known/acme-challenge/ { root /var/www/gramlot-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name gallery-py.gramlot.dev;
    ssl_certificate /etc/letsencrypt/live/gramlot-galleries/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gramlot-galleries/privkey.pem;
    client_max_body_size 1m;
    location = /downloads/gramlot-gallery-serverless.zip {
        alias /opt/gramlot-galleries/downloads/gramlot-gallery-serverless.zip;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="gramlot-gallery-serverless.zip"';
        add_header Cache-Control 'no-cache';
    }
    location / {
        proxy_pass http://127.0.0.1:19182;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name gallery-js.gramlot.dev;
    ssl_certificate /etc/letsencrypt/live/gramlot-galleries/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gramlot-galleries/privkey.pem;
    client_max_body_size 1m;
    location = /downloads/gramlot-gallery-serverless.zip {
        alias /opt/gramlot-galleries/downloads/gramlot-gallery-serverless.zip;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="gramlot-gallery-serverless.zip"';
        add_header Cache-Control 'no-cache';
    }
    location / {
        proxy_pass http://127.0.0.1:19183;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
