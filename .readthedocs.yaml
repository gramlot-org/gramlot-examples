version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "22"
  jobs:
    pre_build:
      - python scripts/prepare_docs_dependencies.py
      - python scripts/prepare_docs.py

sphinx:
  configuration: build/docs-source/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: requirements-docs.txt
